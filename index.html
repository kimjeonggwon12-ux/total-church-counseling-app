<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>총글사 1:1 면담 기록 관리</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 10px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        h1 { color: #333; margin-bottom: 10px; font-size: 32px; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 4px; font-size: 14px; }
        input:focus { outline: none; border-color: #667eea; }
        button { padding: 12px 20px; border: none; border-radius: 4px; background: #667eea; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #5568d3; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
        .stat-box { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.9; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 12px; text-align: left; font-weight: bold; border-bottom: 2px solid #ddd; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f5f5f5; cursor: pointer; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge.done { background: #d4edda; color: #155724; }
        .badge.pending { background: #f8d7da; color: #721c24; }
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 10px; padding: 30px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .close-btn { background: none; border: none; font-size: 28px; cursor: pointer; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; border: 2px solid #ddd; border-radius: 4px; }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .modal-footer { display: flex; gap: 10px; margin-top: 20px; }
        .save-btn { background: #28a745; }
        .save-btn:hover { background: #218838; }
        .cancel-btn { background: #6c757d; }
        .cancel-btn:hover { background: #5a6268; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 총글사 1:1 면담 기록 관리 시스템</h1>
        <p class="subtitle">도마지파 전주교회 교육부</p>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="이름, 교회로 검색...">
            <button onclick="refreshData()">🔄 새로고침</button>
            <button onclick="downloadReport()">📥 보고서 다운로드</button>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number" id="progressRate">0%</div>
                <div class="stat-label">📊 사명 진행율</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="completedCount">0</div>
                <div class="stat-label">✓ 상담 완료</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="pendingCount">0</div>
                <div class="stat-label">○ 미진행</div>
            </div>
            <div class="stat-box">
                <div class="stat-number" id="totalCount">0</div>
                <div class="stat-label">📈 총 인원</div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>번호</th>
                    <th>교회</th>
                    <th>성명</th>
                    <th>맡고싶은사명</th>
                    <th>건강</th>
                    <th>환경</th>
                    <th>상담</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalName"></h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div>
                <div class="form-group">
                    <label>📋 현재의 사명</label>
                    <input type="text" id="현재사명">
                </div>
                <div class="form-group">
                    <label>💭 맡고 싶은 사명</label>
                    <input type="text" id="맡고싶은사명">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="사명유무"> 📍 사명 유무 체크
                    </label>
                </div>
                <div class="form-group">
                    <label>💪 건강 요인</label>
                    <textarea id="건강요인"></textarea>
                </div>
                <div class="form-group">
                    <label>🌍 환경 요인</label>
                    <textarea id="환경요인"></textarea>
                </div>
                <div class="form-group">
                    <label>📝 면담 내용</label>
                    <textarea id="면담내용"></textarea>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="상담완료"> ☑️ 상담 완료
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="save-btn" onclick="saveData()">💾 저장</button>
                <button class="cancel-btn" onclick="closeModal()">취소</button>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let currentIndex = -1;

        // 데모 데이터 생성
        function generateDemoData() {
            allData = Array.from({ length: 84 }, (_, i) => ({
                번호: i + 1,
                교회: '도마지파',
                성명: `사명자${i + 1}`,
                현재사명: '구역장',
                맡고싶은사명: '목사',
                사명유무: i % 2 === 0 ? '✓' : '',
                건강요인: i % 3 === 0 ? '건강함' : i % 3 === 1 ? '보통' : '주의',
                환경요인: i % 2 === 0 ? '가정 화목' : '직장 스트레스',
                면담내용: `면담 내용 ${i + 1}`,
                상담완료: i % 3 === 0 ? '✓' : ''
            }));
        }

        // 데이터 표시
        function displayData(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach((item, idx) => {
                const row = document.createElement('tr');
                row.onclick = () => openModal(idx);
                row.innerHTML = `
                    <td>${item.번호}</td>
                    <td>${item.교회}</td>
                    <td>${item.성명}</td>
                    <td>${item.맡고싶은사명}</td>
                    <td>${item.건강요인}</td>
                    <td>${item.환경요인}</td>
                    <td><span class="badge ${item.상담완료 ? 'done' : 'pending'}">${item.상담완료 ? '완료' : '미진행'}</span></td>
                `;
                tbody.appendChild(row);
            });
            updateStats();
        }

        // 통계 업데이트
        function updateStats() {
            const total = allData.length;
            const completed = allData.filter(x => x.상담완료 === '✓').length;
            const progress = Math.round((allData.filter(x => x.사명유무 === '✓').length / total) * 100);
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('pendingCount').textContent = total - completed;
            document.getElementById('progressRate').textContent = progress + '%';
        }

        // 검색
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allData.filter(x => 
                x.성명.toLowerCase().includes(query) || x.교회.toLowerCase().includes(query)
            );
            displayData(filtered);
        });

        // 모달 열기
        function openModal(idx) {
            currentIndex = idx;
            const item = allData[idx];
            document.getElementById('modalName').textContent = item.성명;
            document.getElementById('현재사명').value = item.현재사명;
            document.getElementById('맡고싶은사명').value = item.맡고싶은사명;
            document.getElementById('사명유무').checked = item.사명유무 === '✓';
            document.getElementById('건강요인').value = item.건강요인;
            document.getElementById('환경요인').value = item.환경요인;
            document.getElementById('면담내용').value = item.면담내용;
            document.getElementById('상담완료').checked = item.상담완료 === '✓';
            document.getElementById('modal').classList.add('active');
        }

        // 모달 닫기
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // 데이터 저장
        function saveData() {
            allData[currentIndex] = {
                ...allData[currentIndex],
                현재사명: document.getElementById('현재사명').value,
                맡고싶은사명: document.getElementById('맡고싶은사명').value,
                사명유무: document.getElementById('사명유무').checked ? '✓' : '',
                건강요인: document.getElementById('건강요인').value,
                환경요인: document.getElementById('환경요인').value,
                면담내용: document.getElementById('면담내용').value,
                상담완료: document.getElementById('상담완료').checked ? '✓' : ''
            };
            displayData(allData);
            closeModal();
            alert('저장되었습니다!');
        }

        // 새로고침
        function refreshData() {
            displayData(allData);
            alert('새로고침 완료!');
        }

        // 보고서 다운로드
        function downloadReport() {
            let html = '<html><head><meta charset="UTF-8"><title>면담보고서</title><style>table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px}</style></head><body><h1>총글사 1:1 면담 기록 보고서</h1><table><thead><tr><th>번호</th><th>교회</th><th>성명</th><th>현재사명</th><th>맡고싶은사명</th><th>사명유무</th><th>건강요인</th><th>환경요인</th><th>면담내용</th></tr></thead><tbody>';
            allData.forEach(item => {
                html += `<tr><td>${item.번호}</td><td>${item.교회}</td><td>${item.성명}</td><td>${item.현재사명}</td><td>${item.맡고싶은사명}</td><td>${item.사명유무}</td><td>${item.건강요인}</td><td>${item.환경요인}</td><td>${item.면담내용}</td></tr>`;
            });
            html += '</tbody></table></body></html>';
            const win = window.open();
            win.document.write(html);
            win.document.close();
        }

        // 초기화
        generateDemoData();
        displayData(allData);
    </script>
</body>
</html>
